name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build all
        run: bun run build:all

      - name: Verify plugin bundle is committed up to date
        run: bun run check:plugin

      - name: Verify plugin type safety
        run: bun run check:types:plugin

      - name: Verify suppression comments
        run: bun run check:suppressions

      - name: Verify version synchronization
        run: bun run check:versions

      - name: Verify generated files are committed up to date
        run: bun run check:generated

      - name: Pack
        run: npm pack

      - name: Bin-resolution smoke test
        run: |
          mkdir scratch
          cd scratch
          npm init -y
          npm install --no-save ../figma-edit-mcp-*.tgz
          npx figma-edit-mcp --version
          npx figma-edit-mcp-socket --version

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: figma-edit-mcp-*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Markdown Link Check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --accept 200..204,403,429,500..504
            --exclude-loopback
            '*.md'

  node-smoke:
    needs: build-and-test
    name: node-smoke (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 'lts/*']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: .

      - name: Install tarball into scratch
        shell: bash
        run: |
          mkdir scratch
          cd scratch
          # Write both deps into package.json and install in one pass.
          # Two separate --no-save installs would prune each other; a single
          # mixed-spec --no-save install confuses npm 11 into re-resolving the
          # local tarball from the registry.
          # Pin to the exact freshly-built tarball — a stale figma-edit-mcp-*.tgz
          # may also be present (e.g. checked into the repo), so a glob is unsafe.
          VERSION=$(node -p "require('../package.json').version")
          TARBALL="../figma-edit-mcp-${VERSION}.tgz"
          cat > package.json <<EOF
          {
            "name": "scratch",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "figma-edit-mcp": "file:$TARBALL",
              "ws": "^8"
            }
          }
          EOF
          npm install

      - name: Bin --version (Node only)
        shell: bash
        working-directory: scratch
        run: |
          npx figma-edit-mcp --version
          npx figma-edit-mcp-socket --version

      - name: Socket boot smoke test
        shell: bash
        working-directory: scratch
        run: node ../scripts/smoke-socket.mjs

      - name: MCP server boot smoke test
        shell: bash
        working-directory: scratch
        run: node ../scripts/smoke-mcp.mjs

  changes:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            publish:
              - 'package.json'
              - 'tsup.config.ts'
              - 'figma_plugin/build.js'
              - 'scripts/integrate.sh'

  dry-run-publish:
    runs-on: ubuntu-latest
    needs: [build-and-test, changes]
    if: needs.changes.outputs.publish == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dry Run Publish
        run: npm publish --dry-run
