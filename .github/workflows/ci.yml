name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build all
        run: bun run build:all

      - name: Pack
        run: npm pack

      - name: Bin-resolution smoke test
        run: |
          mkdir scratch
          cd scratch
          npm init -y
          npm install --no-save ../figma-edit-mcp-*.tgz
          npx figma-edit-mcp --version
          npx figma-edit-mcp-socket --version

      - name: Markdown Link Check
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --accept 200..204,429 
            --exclude-loopback 
            --exclude-mail 
            '*.md'
            'documentation/**/*.md'

  changes:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            publish:
              - 'package.json'
              - 'tsup.config.ts'
              - 'figma_plugin/build.js'
              - 'scripts/integrate.sh'

  dry-run-publish:
    runs-on: ubuntu-latest
    needs: [build-and-test, changes]
    if: needs.changes.outputs.publish == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Dry Run Publish
        run: npm publish --dry-run
