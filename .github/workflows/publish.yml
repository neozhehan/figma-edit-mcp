name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(jq -r .version package.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          [ "$pkg_version" = "$tag_version" ] || { echo "Mismatch: package.json=$pkg_version tag=$tag_version"; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm (Trusted Publishing requires 11.5.1+)
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all
        run: bun run build:all

      - name: Pack
        run: npm pack

      - name: Bin-resolution smoke test
        run: |
          mkdir scratch
          cd scratch
          npm init -y
          npm install --no-save ../figma-edit-mcp-*.tgz
          npx figma-edit-mcp --version
          npx figma-edit-mcp-socket --version

      - name: Publish to NPM
        run: npm publish --provenance --access public
