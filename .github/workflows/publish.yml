name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify tag matches package.json version
        run: |
          pkg_version="$(jq -r .version package.json)"
          tag_version="${GITHUB_REF_NAME#v}"
          [ "$pkg_version" = "$tag_version" ] || { echo "Mismatch: package.json=$pkg_version tag=$tag_version"; exit 1; }

      # Publish tooling only — this is NOT the supported consumer runtime.
      # package.json keeps `engines.node: >=20`, and ci.yml's node-smoke matrix
      # installs the packed tarball on Node 20 explicitly, so that floor stays
      # covered. This runner needs a newer Node because npm 12 (below) requires
      # one, and because Node 20 reached EOL in April 2026.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Pinned to a MAJOR, not `@latest`. `@latest` silently broke the v2.3.3
      # publish: npm 12.0.2 dropped Node 20 (`^22.22.2 || ^24.15.0 || >=26.0.0`)
      # while this job ran Node 20, so the release tagged fine, published
      # nothing, and uploaded no MCPB bundle. A pinned major turns the next
      # npm-major runtime bump into a deliberate edit instead of a failed release.
      - name: Upgrade npm (Trusted Publishing requires 11.5.1+)
        run: npm install -g npm@^12

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all
        run: bun run build:all

      - name: Create MCPB Bundle
        run: |
          npx @anthropic-ai/mcpb pack . figma-edit-mcp.mcpb
          npx @anthropic-ai/mcpb clean figma-edit-mcp.mcpb

      - name: Pack
        run: npm pack

      - name: Bin-resolution smoke test
        run: |
          mkdir scratch
          cd scratch
          npm init -y
          npm install --no-save ../figma-edit-mcp-*.tgz
          npx figma-edit-mcp --version
          npx figma-edit-mcp-socket --version

      - name: Publish to NPM
        run: npm publish --provenance --access public

      - name: Create GitHub Release and Upload Bundle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            figma-edit-mcp.mcpb
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
